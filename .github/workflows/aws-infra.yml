name: AWS Infra (Terraform)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options: [plan, apply]
        default: plan
  pull_request:
    paths:
      - 'infra/aws/**'
  push:
    branches: [main]
    paths:
      - 'infra/aws/**'

# Avoid two runs racing to write/lock the same remote state.
concurrency:
  group: terraform-aws-infra
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    # 'apply' only ever runs via manual workflow_dispatch — pull_request and
    # push-to-main events always just plan, never change real infra unattended.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      # Requires AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets for a
      # least-privilege IAM user (never the account root user).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Show plan output
        if: steps.plan.outcome != 'skipped'
        run: terraform show -no-color tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const output = execSync('terraform show -no-color tfplan', { cwd: 'infra/aws' }).toString();
            const body = `#### Terraform Plan\n\`\`\`\n${output.slice(0, 60000)}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # Only runs when someone manually triggers this workflow and explicitly
      # chooses "apply" — never on a push or PR, since this changes real,
      # billable, production infrastructure.
      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve
